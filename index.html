<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لؤلؤة للخدمات</title>

<style>
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f5f5;
}
header{
    background:#0d6efd;
    color:#fff;
    text-align:center;
    padding:50px 20px;
}
header h1{
    margin:0;
    font-size:32px;
}
header p{
    font-size:18px;
}
.btn{
    display:inline-block;
    margin:10px;
    padding:15px 25px;
    text-decoration:none;
    border-radius:8px;
    color:#fff;
    font-size:18px;
}
.whatsapp{
    background:#25D366;
}
.call{
    background:#0d6efd;
}
section{
    max-width:900px;
    margin:auto;
    padding:25px;
}
.card{
    background:#fff;
    padding:20px;
    margin:15px 0;
    border-radius:10px;
}
</style>
</head>

<body>

<header>
<h1>لؤلؤة للخدمات</h1>

<p>
رش مبيدات • تنظيف منازل • تنظيف وصيانة المكيفات
</p>

<a class="btn whatsapp" href="#">
راسلنا على واتساب
</a>

<a class="btn call" href="#">
اتصل الآن
</a>

</header>

<section>

<div class="card">
<h2>خدماتنا</h2>

<ul>
<li>رش جميع أنواع الحشرات</li>
<li>تنظيف المنازل</li>
<li>تنظيف المكيفات</li>
<li>صيانة المكيفات</li>
</ul>

</div>

</section>

</body>
</html>
